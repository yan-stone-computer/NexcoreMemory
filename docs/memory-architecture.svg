<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">NexcoreWork 项目记忆架构</title>
  <desc id="desc">对话、工具结果和文件变更先经过记忆写入门控，再写入本地 NexcoreWork 项目目录与 SQLite 索引。下一轮执行前，按项目、任务和时效检索，组成上下文。</desc>
  <defs>
    <marker id="arrow-memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#0b8797"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="#f7fbfc"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="54" y="54" font-size="16" font-weight="700" fill="#0d7387" letter-spacing="2">WRITE</text>
    <text x="280" y="54" font-size="16" font-weight="700" fill="#0d7387" letter-spacing="2">CURATE</text>
    <text x="528" y="54" font-size="16" font-weight="700" fill="#0d7387" letter-spacing="2">STORE</text>
    <text x="772" y="54" font-size="16" font-weight="700" fill="#0d7387" letter-spacing="2">RECALL</text>

    <g id="n:conversation">
      <rect x="50" y="100" width="164" height="76" rx="14" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <circle cx="78" cy="126" r="12" fill="#e2f7f5"/>
      <path d="M72 121h12v9H78l-4 4v-4h-2Z" fill="#18b795"/>
      <text x="98" y="132" font-size="18" font-weight="700" fill="#18323b">对话输入</text>
      <text x="70" y="158" font-size="14" fill="#58737d">目标、约束和纠正</text>
    </g>
    <g id="n:tools">
      <rect x="50" y="204" width="164" height="76" rx="14" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <circle cx="78" cy="230" r="12" fill="#e2f7f5"/>
      <path d="m72 232 6-6 5 5 7-8" fill="none" stroke="#0aa8cf" stroke-width="2.2" stroke-linecap="round"/>
      <text x="98" y="236" font-size="18" font-weight="700" fill="#18323b">工具结果</text>
      <text x="70" y="262" font-size="14" fill="#58737d">执行事实与返回值</text>
    </g>
    <g id="n:files">
      <rect x="50" y="308" width="164" height="76" rx="14" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <circle cx="78" cy="334" r="12" fill="#e2f7f5"/>
      <path d="M72 327h8l3 3h7v11H72Z" fill="none" stroke="#0aa8cf" stroke-width="2"/>
      <text x="98" y="340" font-size="18" font-weight="700" fill="#18323b">文件变更</text>
      <text x="70" y="366" font-size="14" fill="#58737d">路径与行级变化</text>
    </g>

    <g id="n:gate">
      <rect x="274" y="166" width="180" height="154" rx="18" fill="#10272f" stroke="#1c4954" stroke-width="1.5"/>
      <text x="302" y="204" font-size="13" font-weight="700" fill="#6fe5be" letter-spacing="1.5">记忆写入门控</text>
      <text x="302" y="238" font-size="17" font-weight="700" fill="#f4fbfc">去重、提炼与分级</text>
      <rect x="302" y="258" width="124" height="1" fill="#2c4d56"/>
      <text x="302" y="286" font-size="14" fill="#bad3d9">项目事实 · 决策 · 待办</text>
    </g>

    <g id="n:store">
      <rect x="510" y="136" width="198" height="214" rx="20" fill="#e9f9f4" stroke="#61d3b4" stroke-width="2"/>
      <text x="538" y="174" font-size="13" font-weight="700" fill="#0a7b6a" letter-spacing="1.2">PROJECT MEMORY</text>
      <text x="538" y="207" font-size="22" font-weight="700" fill="#10272f">.NexcoreWork</text>
      <rect x="538" y="230" width="142" height="38" rx="9" fill="#ffffff" stroke="#c5e8df"/>
      <text x="558" y="255" font-size="15" fill="#274955">项目记忆文件</text>
      <rect x="538" y="278" width="142" height="38" rx="9" fill="#ffffff" stroke="#c5e8df"/>
      <text x="558" y="303" font-size="15" fill="#274955">SQLite 检索索引</text>
      <text x="538" y="336" font-size="13" fill="#5c7d78">可查看 · 可修订 · 可删除</text>
    </g>

    <g id="n:recall">
      <rect x="760" y="166" width="150" height="154" rx="18" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <text x="784" y="202" font-size="13" font-weight="700" fill="#0d7387" letter-spacing="1.3">下一轮执行</text>
      <text x="784" y="234" font-size="18" font-weight="700" fill="#18323b">检索与组装</text>
      <text x="784" y="264" font-size="14" fill="#58737d">项目 / 任务 / 时效</text>
      <text x="784" y="288" font-size="14" fill="#58737d">历史上下文压缩</text>
    </g>

    <g fill="none" stroke="#0b8797" stroke-width="2.4" marker-end="url(#arrow-memory)">
      <path d="M214 138h30v65h30"/>
      <path d="M214 242h60"/>
      <path d="M214 346h30v-65h30"/>
      <path d="M454 243h56"/>
      <path d="M708 243h52"/>
    </g>
    <path d="M835 370v74H132v-60" fill="none" stroke="#18b795" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-memory)"/>
    <text x="400" y="427" font-size="14" fill="#466873">任务结束后写回摘要；下次执行前自动召回</text>
  </g>
</svg>
